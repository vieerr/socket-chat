<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/register.css" />
    <title>ESPEChat — Registrarse</title>
  </head>
  <body>
    <header>
      <h1>ESPEChat</h1>
    </header>
    <main>
      <form action="#" method="post" class="card" id="form">
        <div class="input-group">
          <label for="username">Ingresa tu nombre de usuario</label>
          <input type="text" id="username" autocomplete="username" />
          <span id="error-message" class="error-message" role="alert"></span>
        </div>
        <div class="button-container">
          <button type="submit" class="btn primary" id="login">
            Entrar al Chat
          </button>
        </div>
      </form>
    </main>
    <script src="js/register.js"></script>
  </body>
</html>
